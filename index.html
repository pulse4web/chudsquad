<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Chat</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .glow-bg {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(168, 85, 247, 0.15) 50%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
      animation: pulseGlow 8s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      100% { transform: translate(-50%, -45%) scale(1.2); opacity: 0.4; }
    }

    .container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px;
      gap: 20px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 2;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.94) translateY(20px);
      z-index: 1;
    }

    h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    p {
      margin: 0;
      color: #A1A1AA;
      font-size: 14px;
      line-height: 1.5;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus {
      border-color: rgba(56, 189, 248, 0.6);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    button {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.08) 100%);
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    button:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.15) 100%);
      border-color: rgba(255, 255, 255, 0.4);
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #A1A1AA;
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    #chat-screen {
      padding: 0;
      justify-content: space-between;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .chat-header {
      padding: 18px 24px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      align-self: flex-start;
      animation: messagePop 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .message.self {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.35) 0%, rgba(37, 99, 235, 0.35) 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .message .author {
      font-size: 11px;
      color: #A1A1AA;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .message.self .author {
      color: #BAE6FD;
    }

    .message .text {
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .chat-input-area {
      padding: 16px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
    }

    @keyframes messagePop {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>

  <div class="glow-bg"></div>

  <div class="container">
    
    <!-- Step 1: Access Password -->
    <div id="step-password" class="screen">
      <div class="glass-panel" style="display:flex; flex-direction:column; gap:16px;">
        <h2>Enter Room Key</h2>
        <p>Enter the shared key to unlock this temporary messaging instance.</p>
        <input type="password" id="password-input" placeholder="Shared key..." />
        <button onclick="verifyPassword()">Unlock Access</button>
      </div>
    </div>

    <!-- Step 2: Set Username -->
    <div id="step-username" class="screen hidden">
      <div class="glass-panel" style="display:flex; flex-direction:column; gap:16px;">
        <h2>Display Name</h2>
        <p>Choose a nickname that will be visible to everyone in the room.</p>
        <input type="text" id="username-input" placeholder="Your name..." maxlength="20" />
        <button onclick="goToNotifications()">Continue</button>
      </div>
    </div>

    <!-- Step 3: Notification Setup -->
    <div id="step-notifications" class="screen hidden">
      <div class="glass-panel" style="display:flex; flex-direction:column; gap:16px;">
        <h2>Notifications</h2>
        <p>Stay updated when new messages arrive while this page is in the background.</p>
        <button onclick="enableNotifications(true)">Enable Notifications</button>
        <button class="secondary-btn" onclick="enableNotifications(false)">Skip for Now</button>
      </div>
    </div>

    <!-- Step 4: Live Chat Screen -->
    <div id="chat-screen" class="screen hidden">
      <div class="chat-header">
        <div>
          <span style="font-weight:700; font-size:15px; display:block;">Liquid Chat</span>
          <span style="font-size:11px; color:#A1A1AA;">Messages purge every 30m</span>
        </div>
        <div style="width:8px; height:8px; background:#10B981; border-radius:50%; box-shadow:0 0 8px #10B981;"></div>
      </div>

      <div id="messages" class="chat-messages"></div>

      <div class="chat-input-area">
        <input type="text" id="message-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button style="width: auto; padding: 0 20px;" onclick="sendMessage()">Send</button>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://bqaqbgiegganphnjjdwa.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_U0zHEC9AWY1hplC1ONcMdQ_YXitfrQy';
    
    let supabaseClient;
    
    // Safety check for CDN script loading
    if (window.supabase && window.supabase.createClient) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } else {
      console.error('Supabase library failed to load. Check your network or AdBlocker.');
    }
    
    let currentUser = '';
    let notificationsAllowed = false;

    async function verifyPassword() {
      if (!supabaseClient) return alert('Database connection failed. Please disable adblockers and refresh.');
      
      const pwd = document.getElementById('password-input').value;
      const { data, error } = await supabaseClient.from('app_config').select('shared_password').eq('id', 1).single();
      
      if (error || !data) {
        alert('Error connecting to database. Make sure the table "app_config" exists.');
        return;
      }

      if (data.shared_password === pwd) {
        transitionScreen('step-password', 'step-username');
      } else {
        alert('Incorrect key.');
      }
    }

    function goToNotifications() {
      const name = document.getElementById('username-input').value.trim();
      if (!name) return alert('Please enter a display name.');
      currentUser = name;
      transitionScreen('step-username', 'step-notifications');
    }

    async function enableNotifications(wantNotifications) {
      if (wantNotifications && 'Notification' in window) {
        const permission = await Notification.requestPermission();
        notificationsAllowed = (permission === 'granted');
      }
      enterChat();
    }

    function enterChat() {
      transitionScreen('step-notifications', 'chat-screen');
      loadMessages();
      subscribeToMessages();
    }

    function transitionScreen(fromId, toId) {
      document.getElementById(fromId).classList.add('hidden');
      document.getElementById(toId).classList.remove('hidden');
    }

    async function loadMessages() {
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true });

      if (!error && data) {
        const container = document.getElementById('messages');
        container.innerHTML = '';
        data.forEach(msg => renderMessage(msg, false));
        scrollToBottom();
      }
    }

    function renderMessage(msg, isNew = true) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      const isSelf = msg.username === currentUser;
      
      div.className = `message ${isSelf ? 'self' : ''}`;
      div.innerHTML = `
        <div class="author">${escapeHtml(msg.username)}</div>
        <div class="text">${escapeHtml(msg.content)}</div>
      `;
      container.appendChild(div);
      scrollToBottom();

      if (isNew && !isSelf && notificationsAllowed && document.hidden) {
        new Notification(`New message from ${msg.username}`, {
          body: msg.content,
          icon: 'https://fav.farm/💬'
        });
      }
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      await supabaseClient.from('messages').insert([{ username: currentUser, content: text }]);
    }

    function subscribeToMessages() {
      supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          renderMessage(payload.new, true);
        })
        .subscribe();
    }

    function scrollToBottom() {
      const container = document.getElementById('messages');
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
